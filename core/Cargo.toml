[package]
name = "rusticker-core"
version = "0.3.0"
edition = "2024"
description = "Detects stickers on a uniform-color background and frames them as 512x512 RGBA images."
license = "MIT"
publish = false

[lib]
name = "rusticker_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
image = { version = "0.25", default-features = false }
imageproc = { version = "0.25", default-features = false }
wasm-bindgen = "0.2"

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
