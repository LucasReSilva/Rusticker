name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release-plz:
    name: Release-plz
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Rust (from rust-toolchain.toml)
        run: rustup toolchain install

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: web/package.json

      - name: Run release-plz
        id: release-plz
        uses: release-plz/action@v0.5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync web/package.json on Release PR
        if: steps.release-plz.outputs.prs_created == 'true'
        run: |
          git fetch origin ${{ fromJSON(steps.release-plz.outputs.pr).head_branch }}
          git checkout ${{ fromJSON(steps.release-plz.outputs.pr).head_branch }}
          bun run --cwd web version:sync
          if [ -n "$(git status --porcelain web/package.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add web/package.json
            git commit -m "chore(web): sync package.json version with core"
            git push
          fi

