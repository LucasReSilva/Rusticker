# Web app CI (web-scaffold, design D9). Pre-wired once for the whole roadmap:
# later changes only add the scripts the optional steps call (`lint:design`,
# `seo:check`); they do not edit this file. The wasm steps run only once the
# Rust core exists (core/Cargo.toml).
name: Web

on:
  push:
    branches: [main, develop]
    paths:
      - 'web/**'
      - 'core/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - '.github/workflows/web.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'web/**'
      - 'core/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - '.github/workflows/web.yml'

permissions:
  contents: read

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: web

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: web/package.json

      - name: Set up Rust (from rust-toolchain.toml)
        if: hashFiles('core/Cargo.toml') != ''
        working-directory: .
        run: rustup toolchain install

      - name: Install wasm-pack
        if: hashFiles('core/Cargo.toml') != ''
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack

      - name: Build wasm
        if: hashFiles('core/Cargo.toml') != ''
        working-directory: .
        run: wasm-pack build core --target web

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Compile messages
        run: bun run i18n:compile

      - name: Type check
        run: bun run check

      - name: Lint
        run: bun run lint

      - name: Design lint (if defined)
        run: bun run --if-present lint:design

      - name: Unit tests
        run: bun run test

      - name: Catalog completeness
        run: bun run i18n:check

      - name: Build
        run: bun run build
        env:
          BASE_PATH: /Rusticker

      - name: SEO check (if defined)
        run: bun run --if-present seo:check
        env:
          BASE_PATH: /Rusticker

      - name: Verify build output
        run: bun run verify:build
        env:
          BASE_PATH: /Rusticker

      - name: Read Playwright version
        id: playwright
        run: echo "version=$(bun -e "console.log(require('@playwright/test/package.json').version)")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Playwright Chromium
        run: bunx playwright install --with-deps chromium

      - name: End-to-end tests
        run: bun run --if-present test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 14
